# Hôte public 185.135.132.50 = apex LWS (Apache/Nginx), pas le process Flask.
# Le backend Scalingo écoute sur www.insidevietnamtravel.fr
# (CNAME → insidevietnamtravel.osc-fr1.scalingo.io).
#
# Sans location /admin dédiée, l'apex HTTPS fait 301 vers http://www/admin
# (downgrade HTTP + sauts multiples) puis /admin → /admin/ → /admin/login.
# Les sondes qui suivent cette chaîne tombent en ReadTimeout.
#
# /admin : un seul saut HTTPS vers le backend Scalingo (www), jamais http://www.
# /checkout : URL HTTPS canonique apex (inchangé).
#
# Équivalent Apache (vhost apex LWS, aujourd'hui Apache/2.4.68) :
#   RedirectMatch 301 ^/admin(/.*)?$ https://www.insidevietnamtravel.fr/admin$1
#   RedirectMatch 301 ^/checkout/?$ https://insidevietnamtravel.fr/checkout

server {
    listen 80;
    listen [::]:80;
    server_name insidevietnamtravel.fr www.insidevietnamtravel.fr 185.135.132.50;

    location = /checkout {
        return 301 https://insidevietnamtravel.fr/checkout;
    }

    location = /checkout/ {
        return 301 https://insidevietnamtravel.fr/checkout;
    }

    location = /admin {
        return 301 https://www.insidevietnamtravel.fr/admin;
    }

    location /admin/ {
        return 301 https://www.insidevietnamtravel.fr$request_uri;
    }

    location / {
        return 301 https://insidevietnamtravel.fr$request_uri;
    }
}
