# Hôte public 185.135.132.50 = apex LWS (Apache/Nginx), pas le process Flask.
# Hôte canonique : https://insidevietnamtravel.fr (sans www, sans préfixe /fr/).
#
# Boucles à ne jamais reproduire :
# 1. apex → www  puis  www → apex  (Apache LWS « Redirect / » vers www
#    combiné au 301 Flask/nginx vers l'apex).
# 2. RedirectMatch ^/admin vers l'URL HTTPS apex déjà canonique
#    (redirection vers soi-même sur le vhost :443).
# 3. / → /fr/  puis  /fr/ → /  (préfixe de locale inverse du canonique).
#
# Ces server { } n'écoutent QUE le port 80. Ne pas les copier sur :443 apex :
# un « return 301 https://insidevietnamtravel.fr… » y créerait une boucle.
#
# Équivalent Apache — vhost :80 uniquement, et SUPPRIMER tout Redirect vers www.
# Ne pas ajouter Redirect / ni RewriteRule ^ sur l’apex (chemin /) : boucle www.
#   RewriteEngine On
#   RewriteRule ^/fr/?$ https://insidevietnamtravel.fr/ [L,R=301]
#   RewriteRule ^/fr/(.*)$ https://insidevietnamtravel.fr/$1 [L,R=301]
#   RewriteCond %{HTTP_HOST} ^www\.insidevietnamtravel\.fr [NC]
#   RewriteRule ^ https://insidevietnamtravel.fr%{REQUEST_URI} [L,R=301]

server {
    listen 80;
    listen [::]:80;
    server_name www.insidevietnamtravel.fr;
    return 301 https://insidevietnamtravel.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name insidevietnamtravel.fr 185.135.132.50;

    # Préfixe FR obsolète : un saut vers le chemin canonique (jamais l'inverse).
    location = /fr {
        return 301 https://insidevietnamtravel.fr/;
    }

    location = /fr/ {
        return 301 https://insidevietnamtravel.fr/;
    }

    location /fr/ {
        rewrite ^/fr/(.*)$ https://insidevietnamtravel.fr/$1 permanent;
    }

    location = /checkout {
        return 301 https://insidevietnamtravel.fr/checkout;
    }

    location = /checkout/ {
        return 301 https://insidevietnamtravel.fr/checkout;
    }

    # HTTP /admin seulement — ne pas recopier sur le vhost HTTPS apex.
    location = /admin {
        return 301 https://insidevietnamtravel.fr/admin;
    }

    location /admin/ {
        return 301 https://insidevietnamtravel.fr$request_uri;
    }

    # Pas de location / catch-all : équivaut à Apache « Redirect / » et
    # boucle avec www → apex. Ce vhost :80 ne gère que HTTP→HTTPS
    # (emplacements explicites) et le préfixe obsolète /fr.
}
