# Hôte public 185.135.132.50 = apex LWS (Apache/Nginx), pas le process Flask.
# Hôte canonique : https://insidevietnamtravel.fr (sans www).
#
# www.insidevietnamtravel.fr → 301 HTTPS apex (un seul saut, jamais http://www).
# /admin et /checkout : un seul saut HTTPS vers l'apex.
#
# Équivalent Apache (vhost LWS, aujourd'hui Apache/2.4.68) :
#   RewriteEngine On
#   RewriteCond %{HTTP_HOST} ^www\.insidevietnamtravel\.fr [NC]
#   RewriteRule ^(.*)$ https://insidevietnamtravel.fr/$1 [L,R=301]
#   RedirectMatch 301 ^/admin(/.*)?$ https://insidevietnamtravel.fr/admin$1
#   RedirectMatch 301 ^/checkout/?$ https://insidevietnamtravel.fr/checkout

server {
    listen 80;
    listen [::]:80;
    server_name www.insidevietnamtravel.fr;
    return 301 https://insidevietnamtravel.fr$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name insidevietnamtravel.fr 185.135.132.50;

    location = /checkout {
        return 301 https://insidevietnamtravel.fr/checkout;
    }

    location = /checkout/ {
        return 301 https://insidevietnamtravel.fr/checkout;
    }

    location = /admin {
        return 301 https://insidevietnamtravel.fr/admin;
    }

    location /admin/ {
        return 301 https://insidevietnamtravel.fr$request_uri;
    }

    location / {
        return 301 https://insidevietnamtravel.fr$request_uri;
    }
}
