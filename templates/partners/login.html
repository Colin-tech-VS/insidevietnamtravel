{% extends "partners/layout.html" %}
{% block title %}Connexion{% endblock %}
{% block partner_content %}
<section class="partner-auth card">
  <h1>Espace partenaire</h1>
  <p class="muted">Connectez-vous pour gérer votre page sur Inside Vietnam Travel.</p>
  <form method="post" class="partner-auth__form">
    <input type="hidden" name="next" value="{{ next_url }}">
    <div class="form-field">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" name="email" required autocomplete="username">
    </div>
    <div class="form-field">
      <label for="login-pass">Mot de passe</label>
      <input type="password" id="login-pass" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
  </form>
  <p class="muted partner-auth__footer">
    Pas encore inscrit ? <a href="{{ url_for('become_partner') }}">Devenir partenaire</a>
  </p>
</section>
{% endblock %}
