{% macro json_ld(data) %}
<script type="application/ld+json">{{ data | tojson | safe }}</script>
{% endmacro %}

{% macro json_ld_graph(schemas) %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": {{ schemas | tojson | safe }}
}
</script>
{% endmacro %}

{% macro og_image_tags(image_url, alt=None, width=1200, height=675, type='image/webp') %}
<meta property="og:image" content="{{ image_url }}">
<meta property="og:image:secure_url" content="{{ image_url }}">
<meta property="og:image:type" content="{{ type }}">
<meta property="og:image:width" content="{{ width }}">
<meta property="og:image:height" content="{{ height }}">
<meta property="og:image:alt" content="{{ (alt or meta_title) | e }}">
<meta name="twitter:image" content="{{ image_url }}">
<meta name="twitter:image:alt" content="{{ (alt or meta_title) | e }}">
{% endmacro %}
