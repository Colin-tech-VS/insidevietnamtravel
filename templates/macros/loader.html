{% macro page_loader(hint=None, sub='Travel') %}
<div id="page-loader" class="page-loader" role="status" aria-live="polite" aria-busy="true" aria-label="{{ t('loader.aria') }}">
  <div class="page-loader__inner">
    <svg class="page-loader__logo" viewBox="0 0 40 40" aria-hidden="true">
      <circle class="page-loader__ring" cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path id="loader-arc" class="page-loader__arc" d="M8 26 Q20 8 32 26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      <circle class="page-loader__traveler" r="3.5" fill="currentColor">
        <animateMotion dur="2.2s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" path="M8 26 Q20 8 32 26"/>
      </circle>
    </svg>
    <p class="page-loader__brand">
      <span class="page-loader__name">Inside Vietnam</span>
      <span class="page-loader__sub">{{ sub }}</span>
    </p>
    <p class="page-loader__hint">{{ hint or t('loader.hint') }}</p>
  </div>
</div>
{% endmacro %}
