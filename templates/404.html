{% extends "base.html" %}

{% block meta_robots %}noindex, follow{% endblock %}

{% block content %}
<section class="error-page">
  <div class="container error-inner">
    <span class="error-code" aria-hidden="true">404</span>
    <h1>{{ t('404.title') }}</h1>
    <p>{{ t('404.lead') }}</p>
    <a href="{{ lang_url('index') }}" class="btn btn-primary">{{ t('404.cta') }}</a>
  </div>
</section>
{% endblock %}
